<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Park - Show Place</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/index.js"></script>
</head>
<body onload="showData();">
  <div id="header"></div>

  <main class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card shadow-lg border-0">
          <div class="card-header bg-info text-white text-center">
            <h2 class="mb-0">Where Is My Car?</h2>
          </div>
          <div class="card-body p-4">

            <div id="divData" class="text-center">

              <p class="mb-2"><strong>Date &amp; Time:</strong> <span id="txtDate">--</span></p>
              <p class="mb-2"><strong>Color Section:</strong> <span id="txtColor">--</span></p>
              <p class="mb-2"><strong>Section Code:</strong> <span id="txtSection">--</span></p>
              <p class="mb-2"><strong>Space Number:</strong> <span id="txtNumber">--</span></p>

              <div id="coordRow" style="display:none;">
                <hr class="my-3">
                <p class="mb-1"><strong>Latitude:</strong> <span id="txtLat">--</span></p>
                <p class="mb-3"><strong>Longitude:</strong> <span id="txtLng">--</span></p>
                <iframe
                  id="parkMap"
                  width="100%"
                  height="300"
                  style="border:0; border-radius: 8px; margin-bottom: 12px;"
                  loading="lazy"
                  allowfullscreen
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
              </div>

            </div>

            <div id="noDataAlert" class="alert alert-warning mt-4 text-center" style="display:none;">
              No parking data found. Save a location on the <a href="/">Home</a> page first.
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="footer"></div>
</body>
</html>
