<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Park - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/index.js"></script>
</head>
<body>
  <div id="header"></div>

  <main class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card shadow-lg border-0">
          <div class="card-header bg-primary text-white text-center">
            <h2 class="mb-0">Where Did I Park?</h2>
          </div>
          <div class="card-body p-4">

            <form id="parkForm" onsubmit="return false;">

              <div class="mb-3">
                <label for="selColor" class="form-label fw-semibold">Color Section</label>
                <select id="selColor" class="form-select">
                  <option value="Selecione" selected>Select a color...</option>
                  <option value="Yellow">Yellow</option>
                  <option value="Blue">Blue</option>
                  <option value="Orange">Orange</option>
                  <option value="Green">Green</option>
                  <option value="Red">Red</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="txtSection" class="form-label fw-semibold">Section Code</label>
                <input type="text" id="txtSection" class="form-control" placeholder="e.g. A" maxlength="5" autocomplete="off">
              </div>

              <div class="mb-4">
                <label for="txtNumber" class="form-label fw-semibold">Space Number</label>
                <input type="text" id="txtNumber" class="form-control" placeholder="e.g. 120" maxlength="6" autocomplete="off">
              </div>

              <div class="d-grid mb-3">
                <button type="button" class="btn btn-outline-secondary" id="btnLocation" onclick="getMyLocation()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pin-map me-1" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M3.1 11.2a.5.5 0 0 1 .4-.2H6a.5.5 0 0 1 0 1H3.75a.5.5 0 0 1-.5-.5V5.925a.5.5 0 0 1 1 0v5.275a.5.5 0 0 1-.5.5zm.9-7.8a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/>
                    <path fill-rule="evenodd" d="M8 2cl-4.418 0-8 3.582-8 8a8 8 0 0 0 16 0c0-4.418-3.582-8-8-8zM8 12a4 4 0 0 1-4-4 4 4 0 0 1 4-4 4 4 0 0 1 4 4 4 4 0 0 1-4 4z"/>
                  </svg>
                  Get My Location
                </button>
              </div>

              <div class="d-grid">
                <button type="button" class="btn btn-primary btn-lg" onclick="saveData()">
                  Save Place
                </button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="footer"></div>

  <div class="modal fade" id="MessageModal" tabindex="-1" aria-labelledby="MessageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="MessageModalLabel">Success</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">Your parking location has been saved successfully!</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
